<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ULTRON</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <button class="new-chat-btn" id="newChatBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
          <span>New chat</span>
        </button>
        <button class="icon-btn collapse-btn" id="collapseBtn" title="Close sidebar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
        </button>
      </div>

      <div class="search-box">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" placeholder="Search chats">
      </div>

      <nav class="chat-list" id="chatList"></nav>

      <div class="sidebar-bottom">
        <div class="user-chip" id="userChip">
          <div class="user-avatar">M</div>
          <span class="user-name">Mano</span>
          <svg class="dots" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>
        </div>
      </div>
    </aside>

    <!-- Main -->
    <main class="main">
      <header class="topbar">
        <button class="icon-btn open-sidebar-btn" id="openSidebarBtn" title="Open sidebar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
        </button>
        <button class="model-selector" id="statusBadge">
          <span class="status-dot" id="statusDot"></span>
          <span id="modelName">ULTRON</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="effort-selector" id="effortSelector">
          <button class="effort-pill active" data-effort="auto">Auto</button>
          <button class="effort-pill" data-effort="low">Low</button>
          <button class="effort-pill" data-effort="medium">Med</button>
          <button class="effort-pill" data-effort="high">High</button>
          <button class="effort-pill" data-effort="max">Max</button>
        </div>
        <div class="model-menu" id="settingsMenu">
          <div class="settings-row">
            <label for="apiBaseInput">API base URL</label>
            <input type="text" id="apiBaseInput" placeholder="http://localhost:8000" spellcheck="false">
          </div>
          <div class="settings-status" id="settingsStatus">Not connected</div>
          <div class="settings-actions">
            <button type="button" class="settings-btn" id="testConnBtn">Test & save</button>
          </div>
        </div>
      </header>

      <section class="chat-area" id="chatArea">
        <div class="welcome" id="welcome">
          <h1>What are you working on?</h1>
          <div class="suggestion-row" id="suggestionRow">
            <button class="suggestion-chip" data-prompt="Give me 5 ideas for a weekend side project">💡 Brainstorm ideas</button>
            <button class="suggestion-chip" data-prompt="Explain how transformers work in simple terms">📘 Explain a concept</button>
            <button class="suggestion-chip" data-prompt="Write a short professional email declining a meeting">✍️ Draft an email</button>
            <button class="suggestion-chip" data-prompt="Debug why my Python loop never terminates">🐞 Debug my code</button>
          </div>
        </div>
        <div class="messages" id="messages"></div>
      </section>

      <div class="composer-wrap">
        <input type="file" id="fileInput" accept="image/*" hidden>
        <div class="image-preview" id="imagePreview"></div>
        <form class="composer" id="composerForm">
          <button type="button" class="icon-btn attach-btn" title="Attach">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
          </button>
          <textarea id="composerInput" placeholder="Message ULTRON" rows="1"></textarea>
          <button type="submit" class="send-btn" id="sendBtn" disabled title="Send">
            <svg class="send-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
            <svg class="stop-icon" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
          </button>
        </form>
        <div class="disclaimer">ULTRON can make mistakes. Verify important info. <span id="apiHint"></span></div>
      </div>
    </main>
  </div>

<script src="/static/script.js"></script>
</body>
</html>
